max_output_tokens: 32000
default: opus-high   # used by `thalamus ask/eval` when --config is omitted, and by the web app when ENABLED_CONFIGS is unset
configs:
  - {id: opus-medium,  provider: anthropic, model: claude-opus-5-5, effort: medium}
  - {id: opus-high,    provider: anthropic, model: claude-opus-5-5, effort: high}
  - {id: fable-medium, provider: anthropic, model: claude-fable-5-1, effort: medium}
  - {id: fable-high,   provider: anthropic, model: claude-fable-5-1, effort: high}
  - {id: astra-medium, provider: openai,    model: gpt-6-astra,      effort: medium}
  - {id: astra-high,   provider: openai,    model: gpt-6-astra,      effort: high}
